name: Build Cross-Platform Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs: 
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.1.1

      - name: Build Android APKs
        run: gradle assembleDebug

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Snailflix-Mobile
          path: app/build/outputs/apk/mobile/debug/app-mobile-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Snailflix-TV
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk

  build-windows:
    runs-on: windows-latest  # CRITICAL: Powershell and Windows Kits require a Windows runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Windows Staging Directory
        shell: powershell
        run: |
          # Ensure win_staging and Assets directories exist
          New-Item -ItemType Directory -Force -Path "win_staging\Assets"

          # Copy appxmanifest.xml from root into win_staging as AppxManifest.xml
          Copy-Item "appxmanifest.xml" -Destination "win_staging\AppxManifest.xml" -Force

          # Create dummy executable if missing
          if (-not (Test-Path "win_staging\Snailflix.exe")) {
              New-Item -ItemType File -Force -Path "win_staging\Snailflix.exe"
          }

          # Create placeholder PNG images if missing
          $pngBytes = [System.Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==")
          
          @("StoreLogo.png", "Square150x150Logo.png", "Square44x44Logo.png") | ForEach-Object {
              $imgPath = "win_staging\Assets\$_"
              if (-not (Test-Path $imgPath)) {
                  [System.IO.File]::WriteAllBytes($imgPath, $pngBytes)
              }
          }

      - name: Build MSIX Package
        shell: powershell
        run: |
          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Select-Object -Last 1).FullName
          & $makeappx pack /d win_staging /p Snailflix-Windows.msix /o

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snailflix-Windows
          path: Snailflix-Windows.msix  # Corrected path to target the generated file

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Desktop Package
        run: |
          mkdir -p linux_dist
          cp sps/snailflix.html linux_dist/index.html

      # NEW STEP: Compress the distribution folder into a zip file
      - name: Compress Linux Build to ZIP
        run: |
          zip -r Snailflix-Linux.zip linux_dist

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-distribution-snailflix
          path: Snailflix-Linux.zip  # Updated to upload the zip file directly
