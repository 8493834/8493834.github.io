name: Build Cross-Platform Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # --- Android TV & Mobile  ---
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.1.1

      - name: Build Android APKs
        run: gradle assembleDebug

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Snailflix-Mobile
          path: app/build/outputs/apk/mobile/debug/app-mobile-debug.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Snailflix-TV
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk

  # --- Windows App ---
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild & Windows Tools
        uses: microsoft/setup-msbuild@v2

      - name: Stage Windows App Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path win_staging
          Copy-Item appxmanifest.xml win_staging/
          
          # Copy HTML file from the sps folder
          if (Test-Path sps/snailflix.html) { 
              Copy-Item sps/snailflix.html win_staging/ 
          } elseif (Test-Path sps/index.html) { 
              Copy-Item sps/index.html win_staging/ 
          } else {
              Get-ChildItem -Path sps -Filter *.html | Copy-Item -Destination win_staging/
          }

          if (Test-Path manifest.json) { Copy-Item manifest.json win_staging/ }
          
          # Create assets directory and copy icon
          New-Item -ItemType Directory -Force -Path win_staging/assets
          if (Test-Path app/src/main/res/mipmap/ic_launcher.png) {
              Copy-Item app/src/main/res/mipmap/ic_launcher.png win_staging/assets/
          }

      - name: Package MSIX
        shell: powershell
        run: |
          # Locate makeappx.exe in the installed Windows SDK directory
          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Select-Object -Last 1).FullName
          
          # Run makeappx to build the MSIX package
          & $makeappx pack /d win_staging /p Snailflix-Windows.msix /o

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snailflix-Windows
          path: Snailflix-Windows.msix