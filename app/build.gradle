plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snailflix'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    flavorDimensions "device"

    productFlavors {
        mobile {
            dimension "device"
            applicationId "com.snailflix.mobile"
            versionCode 1
            versionName "1.0.0-mobile"
        }
        tv {
            dimension "device"
            applicationId "com.snailflix.tv"
            versionCode 1
            versionName "1.0.0-tv"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
